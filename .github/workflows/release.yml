name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows (nsis / portable / zip)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip ; pip install -r backend/requirements.txt
      - name: Compile backend sidecar (PyInstaller)
        run: python backend/build_exe.py
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install frontend dependencies
        run: cd app ; npm install
      - name: Build & package (electron-builder)
        run: cd app ; npm run dist
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: app/dist-electron/*
          if-no-files-found: warn

  build-linux:
    name: Build Linux (AppImage / deb / pacman / tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system tooling
        run: sudo apt-get update ; sudo apt-get install -y fakeroot rpm dpkg libarchive-tools
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip ; pip install -r backend/requirements.txt
      - name: Compile backend sidecar (PyInstaller)
        run: python backend/build_exe.py
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install frontend dependencies
        run: cd app ; npm install
      - name: Build & package (electron-builder)
        run: cd app ; npm run dist
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: app/dist-electron/*
          if-no-files-found: warn

  release:
    name: Publish to GitHub Releases
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}